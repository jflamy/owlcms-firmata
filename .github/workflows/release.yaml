name: Build and Release owlcms-firmata

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 2.6.0-rc01)'
        required: true
        type: string

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Clone firmata4j
        run: git clone --branch webserial https://github.com/jflamy/firmata4j ../firmata4j

      - name: Build and install firmata4j
        run: |
          # Remove any cached "not found" marker for firmata4j
          rm -rf ~/.m2/repository/com/github/kurbatov/firmata4j
          cd ../firmata4j
          mvn -DskipTests install
          # Verify install succeeded
          ls -la ~/.m2/repository/com/github/kurbatov/firmata4j/2.3.9-owlcms04/

      - name: Copy device configs to resources
        run: |
          rm -rf src/main/resources/devices
          mkdir -p src/main/resources/devices
          find diagrams -name '*.xlsx' -print0 | xargs -0 -I {} cp {} src/main/resources/devices/

      - name: Build owlcms-firmata
        env:
          TAG: ${{ inputs.version }}
        run: mvn -Pproduction clean package

      - name: Prepare release artifact
        run: |
          mkdir -p dist/files
          cp target/owlcms-firmata.jar dist/files

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: Release ${{ inputs.version }}
          files: dist/files/owlcms-firmata.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
